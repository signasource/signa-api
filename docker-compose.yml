services:
  postgres:
    image: postgres:17
    container_name: signa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  signa-api:
    build: .
    container_name: signa-api
    restart: unless-stopped
    command: ["--import-content"]
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM:-${MAIL_USERNAME}}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      BASE_URL: ${BASE_URL}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON}
      GOOGLE_PLAY_ENABLED: ${GOOGLE_PLAY_ENABLED:-false}
      GOOGLE_PLAY_PACKAGE_NAME: ${GOOGLE_PLAY_PACKAGE_NAME:-com.signasource.signamobile}
      GOOGLE_PLAY_CREDENTIALS_JSON: ${GOOGLE_PLAY_CREDENTIALS_JSON}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      PANEL_URL: ${PANEL_URL}
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN}
      MERCADO_PAGO_WEBHOOK_SECRET: ${MERCADO_PAGO_WEBHOOK_SECRET}
      ORG_OPS_ALERT_EMAIL: ${ORG_OPS_ALERT_EMAIL}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD}
      # Grafana Cloud read access for the admin usage dashboard's performance panels (optional).
      GRAFANA_CLOUD_PROM_QUERY_URL: ${GRAFANA_CLOUD_PROM_QUERY_URL:-}
      GRAFANA_CLOUD_PROM_USER: ${GRAFANA_CLOUD_PROM_USER:-}
      GRAFANA_CLOUD_READ_TOKEN: ${GRAFANA_CLOUD_READ_TOKEN:-}
    depends_on:
      - postgres

  nginx:
    image: nginx:alpine
    container_name: signa-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/templates:/etc/nginx/templates
    depends_on:
      - signa-api

  # Host CPU/memory/disk/network of the droplet.
  node-exporter:
    image: prom/node-exporter:latest
    container_name: signa-node-exporter
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - '/:/host:ro,rslave'

  # Per-container CPU/memory/IO (signa-api vs postgres vs nginx).
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: signa-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  # PostgreSQL internals: connections, DB size, tuples, cache hit ratio.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: signa-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable"
    depends_on:
      - postgres

  alloy:
    image: grafana/alloy:latest
    container_name: signa-alloy
    restart: unless-stopped
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy
      - alloy_data:/var/lib/alloy/data
    environment:
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY}
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    depends_on:
      - signa-api
      - node-exporter
      - cadvisor
      - postgres-exporter

volumes:
  postgres_data: {}
  alloy_data: {}
