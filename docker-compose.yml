services:
  postgres:
    image: postgres:17
    container_name: signa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  signa-api:
    build: .
    container_name: signa-api
    restart: unless-stopped
    # Validate + import ALL content under content/ on startup. Unchanged courses are skipped;
    # if any YAML is invalid, startup fails and the error shows in the logs.
    command: ["--import-content"]
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    depends_on:
      - postgres
    volumes:
      - ./secrets/firebase.json:/secrets/firebase.json:ro

volumes:
  postgres_data: {}
