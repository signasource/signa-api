spring:
  application:
    name: signa-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  health:
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

app:
  base-url:
  panel-url: ${PANEL_URL:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  content:
    import-on-startup: ${CONTENT_IMPORT_ON_STARTUP:true}

auth:
    google:
        client-id: ${GOOGLE_CLIENT_ID:default-client-id}
    jwt:
        secret: ${JWT_SECRET}
    token-expirations:
        password-reset: 3600000      # 1 hour
        access: 900000               # 15 minutes
        refresh: 604800000           # 7 days
        email-verification: 86400000 # 24 hours

firebase:
  enabled: true
  global-topic: global
  credentials-json: ${FIREBASE_CREDENTIALS_JSON:}

google-play:
  enabled: ${GOOGLE_PLAY_ENABLED:false}
  package-name: ${GOOGLE_PLAY_PACKAGE_NAME:com.signasource.signamobile}
  credentials-json: ${GOOGLE_PLAY_CREDENTIALS_JSON:}

r2:
  endpoint: ${R2_ENDPOINT:}
  access-key-id: ${R2_ACCESS_KEY_ID:}
  secret-access-key: ${R2_SECRET_ACCESS_KEY:}
  bucket: ${R2_BUCKET_NAME:signa-animations}
  presign-expiry-minutes: ${R2_PRESIGN_EXPIRY_MINUTES:15}

organizations:
  pricing:
    currency: ARS
    price-per-sign-per-day: ${ORG_PRICE_PER_SIGN_PER_DAY:5}
    min-price-per-seat: ${ORG_MIN_PRICE_PER_SEAT:5000}
  purchases:
    min-days: 15
    max-days: 60
    invitation-days: 10
    auto-reminder-after-days: 5
    manual-reminder-cooldown-hours: 24
    max-seats: 500

admin:
  seed:
    email: ${ADMIN_SEED_EMAIL:}
    password: ${ADMIN_SEED_PASSWORD:}
