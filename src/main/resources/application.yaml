spring:
  application:
    name: signa-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: 8080

app:
  security:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 15000
  refresh-token-expiration: 604800000
