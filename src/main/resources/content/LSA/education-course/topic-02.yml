    name: "Para escribir y dibujar"
    description: "Los útiles que usás para escribir, pintar y corregir."
    blocks:
      - type: INTRODUCE_SIGN
        config:
          meaning: "lápiz"
      - type: INTRODUCE_SIGN
        config:
          meaning: "lápices de colores"
      - type: INTRODUCE_SIGN
        config:
          meaning: goma de borrar
      - type: INTRODUCE_SIGN
        config:
          meaning: sacapuntas
      - type: INTRODUCE_SIGN
        config:
          meaning: regla
      - type: INTRODUCE_SIGN
        config:
          meaning: resaltador

      - type: SELECT_MEANING
        xp: 10
        config:
          sign: "lápiz"
          options:
            - "lápiz"
            - "lápices de colores"
            - goma de borrar
            - regla
      - type: SELECT_SIGN
        xp: 10
        config:
          word: sacapuntas
          options:
            - sacapuntas
            - goma de borrar
            - resaltador
            - regla
      - type: SELECT_MEANING
        xp: 10
        config:
          sign: resaltador
          options:
            - resaltador
            - "lápiz"
            - regla
            - sacapuntas
      - type: SELECT_SIGN
        xp: 10
        config:
          word: "lápices de colores"
          options:
            - "lápices de colores"
            - "lápiz"
            - goma de borrar
            - resaltador
      - type: CONTEXT_RESPONSE
        xp: 15
        config:
          question: "¿Qué usás para borrar lo que escribiste con lápiz?"
          answer: goma de borrar
          options:
            - sacapuntas
            - goma de borrar
            - regla
            - resaltador
      - type: MATCH
        xp: 20
        config:
          concepts:
            - "lápiz"
            - "lápices de colores"
            - goma de borrar
            - sacapuntas
            - regla
            - resaltador

