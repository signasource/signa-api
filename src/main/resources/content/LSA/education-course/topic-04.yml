topic:
  code: unidad-4
  title: "Unidad 4"
  subtitle: "Tecnología y oficina"
  description: "Aprendé el vocabulario de los equipos tecnológicos y las herramientas de oficina."

lessons:
  - code: leccion-1
    name: "Equipos tecnológicos"
    description: "Los equipos que se usan en la escuela y la oficina."
    blocks:
      - type: INTRODUCE_SIGN
        config:
          meaning: cpu
      - type: INTRODUCE_SIGN
        config:
          meaning: impresora
      - type: INTRODUCE_SIGN
        config:
          meaning: "escáner"
      - type: INTRODUCE_SIGN
        config:
          meaning: proyector

      - type: SELECT_MEANING
        xp: 10
        config:
          sign: impresora
          options:
            - impresora
            - cpu
            - "escáner"
            - proyector
      - type: SELECT_SIGN
        xp: 10
        config:
          word: proyector
          options:
            - proyector
            - impresora
            - "escáner"
            - cpu
      - type: SELECT_MEANING
        xp: 10
        config:
          sign: "escáner"
          options:
            - "escáner"
            - impresora
            - proyector
            - cpu
      - type: CONTEXT_RESPONSE
        xp: 15
        config:
          question: "¿Qué equipo usás para pasar un documento de papel a la computadora?"
          answer: "escáner"
          options:
            - impresora
            - "escáner"
            - proyector
            - cpu
      - type: MATCH
        xp: 20
        config:
          concepts:
            - cpu
            - impresora
            - "escáner"
            - proyector

