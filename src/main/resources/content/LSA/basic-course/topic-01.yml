topic:
  code: unidad-1
  name: Unidad 1: Conceptos básicos
  description: Aprende las señas fundamentales para comenzar a comunicarte en LSA.

lessons:
  - code: leccion-2
    name: Formulas de Cortesía
    description: Aprende las señas de las fórmulas de cortesía más utilizadas.

    blocks:
      - type: SELECT_MEANING
        xp: 5
        config:
          sign: hola
          options:
            - hola
            - chau
            - gracias
            - perdón

      - type: SELECT_SIGN
        xp: 5
        config:
          word: chau
          options:
            - hola
            - chau
            - por favor
            - gracias

      - type: VISUAL_RECOGNITION
        xp: 15
        config:
          signSequence:
            - hola
            - gracias
            - chau
            - por favor
          options:
            - hola
            - chau
            - gracias
            - por favor
            - perdón
          keepOrder: false

      - type: SELECT_MEANING
        xp: 5
        config:
          sign: por favor
          options:
            - por favor
            - gracias
            - hola
            - perdón

      - type: SELECT_SIGN
        xp: 5
        config:
          word: gracias
          options:
            - chau
            - perdón
            - gracias
            - hola

      - type: MATCH
        xp: 10
        config:
          concepts:
            - hola
            - chau
            - por favor
            - gracias
            - perdón

      # cambiar la pregunta
      - type: CONTEXT_RESPONSE
        xp: 5
        config:
          question: "¿Qué dirías si alguien te ayuda?"
          answer: gracias
          options:
            - hola
            - gracias
            - perdón
            - chau

  - code: leccion-3
    name: Pronombres personales
    description: Practica las señas de los pronombres personales.

    blocks:
      - type: SELECT_MEANING
        xp: 5
        config:
          sign: yo
          options:
            - yo
            - vos
            - él
            - nosotros

      - type: SELECT_SIGN
        xp: 5
        config:
          word: vos
          options:
            - yo
            - vos
            - ella
            - nosotros

      - type: SELECT_MEANING
        xp: 5
        config:
          sign: él
          options:
            - él
            - ella
            - vos
            - nosotros

      - type: MATCH
        xp: 10
        config:
          concepts:
            - yo
            - vos
            - él
            - ella
            - nosotros

      - type: VISUAL_RECOGNITION
        xp: 15
        config:
          signSequence:
            - yo
            - vos
            - ella
            - nosotros
          options:
            - yo
            - él
            - ella
            - nosotros
            - vos
          keepOrder: false

      - type: CONTEXT_RESPONSE
        xp: 5
        config:
          question: "¿Quién tiene un sombrero?"
          answer: ella
          options:
            - yo
            - vos
            - ella
            - nosotros

  - code: leccion-4
    name: Días de la semana
    description: Practica las señas de los días de la semana.

    blocks:
      - type: SELECT_MEANING
        xp: 5
        config:
          sign: lunes
          options:
            - lunes
            - martes
            - viernes
            - domingo

      - type: SELECT_SIGN
        xp: 5
        config:
          word: miércoles
          options:
            - miércoles
            - jueves
            - sábado
            - lunes

      - type: CONTEXT_RESPONSE
        xp: 5
        config:
          question: "¿Qué día sigue después del viernes?"
          answer: sábado
          options:
            - jueves
            - viernes
            - sábado
            - domingo

      - type: SELECT_MEANING
        xp: 5
        config:
          sign: jueves
          options:
            - jueves
            - martes
            - domingo
            - sábado

      - type: SELECT_SIGN
        xp: 5
        config:
          word: viernes
          options:
            - martes
            - viernes
            - lunes
            - domingo

      - type: MATCH
        xp: 10
        config:
          concepts:
            - lunes
            - martes
            - miércoles
            - jueves
            - viernes
            - sábado
            - domingo

      - type: VISUAL_RECOGNITION
        xp: 5
        config:
          signSequence:
            - lunes
            - miércoles
            - viernes
            - domingo
          options:
            - lunes
            - martes
            - miércoles
            - jueves
            - viernes
            - sábado
            - domingo
          keepOrder: false

      
