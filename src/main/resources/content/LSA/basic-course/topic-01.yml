topic:
  code: unidad-1
  name: "Unidad 1: Conceptos básicos"
  description: Aprende las señas fundamentales para comenzar a comunicarte en LSA.

lessons:
  - code: leccion-2
    name: Formulas de Cortesía
    description: Aprende las señas de las fórmulas de cortesía más utilizadas.

    blocks:
      - type: SELECT_MEANING
        xp: 5
        config:
          sign: hola
          options:
            - hola
            - chau
            - gracias
            - perdón

      - type: SELECT_SIGN
        xp: 5
        config:
          word: chau
          options:
            - hola
            - chau
            - por favor
            - gracias

      - type: VISUAL_RECOGNITION
        xp: 15
        config:
          sign_sequence:
            - hola
            - gracias
            - chau
            - por favor
          options:
            - hola
            - chau
            - gracias
            - por favor
            - perdón
          keep_order: false

      - type: SELECT_MEANING
        xp: 5
        config:
          sign: por favor
          options:
            - por favor
            - gracias
            - hola
            - perdón

      - type: SELECT_SIGN
        xp: 5
        config:
          word: gracias
          options:
            - chau
            - perdón
            - gracias
            - hola

      - type: MATCH
        xp: 10
        config:
          concepts:
            - hola
            - chau
            - por favor
            - gracias
            - perdón

      # cambiar la pregunta
      - type: CONTEXT_RESPONSE
        xp: 5
        config:
          question: "¿Qué dirías si alguien te ayuda?"
          answer: gracias
          options:
            - hola
            - gracias
            - perdón
            - chau

  - code: leccion-3
    name: Pronombres personales
    description: Practica las señas de los pronombres personales.

    blocks:
