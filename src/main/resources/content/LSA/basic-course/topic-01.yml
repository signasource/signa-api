        xp: 5
        config:
          sign: yo
          options:
            - yo
            - vos
            - él
            - nosotros

      - type: SELECT_SIGN
        xp: 5
        config:
          word: vos
          options:
            - yo
            - vos
            - ella
            - nosotros

      - type: SELECT_MEANING
        xp: 5
        config:
          sign: él
          options:
            - él
            - ella
            - vos
            - nosotros

      - type: MATCH
        xp: 10
        config:
          concepts:
            - yo
            - vos
            - él
            - ella
            - nosotros

      - type: VISUAL_RECOGNITION
        xp: 15
        config:
          sign_sequence:
            - yo
            - vos
            - ella
            - nosotros
          options:
            - yo
            - él
            - ella
            - nosotros
            - vos
          keep_order: false

      - type: CONTEXT_RESPONSE
        xp: 5
        config:
          question: "¿Quién tiene un sombrero?"
          answer: ella
          options:
            - yo
            - vos
            - ella
            - nosotros

