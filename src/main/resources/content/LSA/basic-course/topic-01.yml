topic:
  code: unidad-1
  title: "Unidad 1"
  subtitle: "Presentándonos"
  description: Aprendé a presentarte y a usar señas básicas de interacción.

lessons:
  - code: leccion-1
    name: "Deletrear tu nombre"
    description: "La seña personal en la comunidad sorda y cómo deletrear tu nombre con el alfabeto dactilológico."

    blocks:
      - type: INFO
        xp: 5
        config:
          title: "La seña personal"
          text: |
            En la comunidad sorda cada persona tiene una seña personal: una seña única que la identifica y que reemplaza a su nombre en la conversación. Deletrear un nombre letra por letra cada vez que se lo menciona sería lento, así que la seña personal cumple esa función.

            Lo más importante es que la seña personal no se elige: la otorga la comunidad sorda. Ponerse una seña a uno mismo no es parte de la costumbre, y recibirla suele marcar un momento de pertenencia.

      - type: INFO
        xp: 5
        config:
          title: "De dónde sale una seña personal"
          text: |
            Casi siempre surge de algo propio de la persona, y por eso no hay dos iguales.

            Puede venir de un rasgo físico (un lunar, el pelo enrulado, los anteojos), de un gesto o una costumbre (cómo se ríe, cómo saluda), de algo que hace o le gusta, o de la inicial del nombre combinada con alguno de esos rasgos.

      - type: INFO
        xp: 5
        config:
          title: "Mientras tanto, se deletrea"
          text: |
            Hasta que una persona recibe su seña personal —o cuando habla con alguien que todavía no la conoce— el nombre se deletrea con el alfabeto dactilológico, letra por letra.

            El deletreo también se usa para nombres de lugares, marcas y palabras que no tienen una seña establecida. No reemplaza a la lengua: es un recurso puntual dentro de ella.

      - type: INFO
        xp: 5
        config:
          title: "Ahora vos"
          text: |
            En la próxima pantalla vas a escribir tu nombre y deletrearlo con las manos, letra por letra, mientras la cámara te va marcando cuáles vas logrando.

            No hace falta apurarse: cada letra se sostiene un momento hasta que queda reconocida.

      - type: SPELL_NAME
        xp: 20
        config:
          max_letters: 10

      - type: INVISIBLE_SIGNS
        config:
          signs:
            - A
            - B
            - C
            - D
            - E
            - F
            - G
            - H
            - I
            - J
            - K
            - L
            - M
            - N
            - "Ñ"
            - O
            - P
            - Q
            - R
            - S
            - T
            - U
            - V
            - W
            - X
            - Y
            - Z

