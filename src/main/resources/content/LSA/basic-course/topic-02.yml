topic:
  code: unidad-2
  title: "Unidad 2"
  subtitle: "Números y tiempo"
  description: Aprende los números y a hablar sobre los días y el tiempo en LSA.

lessons:
  - code: "leccion_informativa_numeros"
    name: "Los números en la LSA"
    description: "Conocé cómo se expresan los números en la Lengua de Señas Argentina y por qué son importantes en la comunicación cotidiana."

    blocks:
      - type: INFO
        xp: 5
        config:
          title: "Contar en LSA"
          text: |
            Los números son una de las primeras herramientas que aprendemos en cualquier lengua.

            En la LSA, los números se expresan con configuraciones específicas de la mano, y son fundamentales para hablar de cantidades, edades, horarios y mucho más.

      - type: INFO
        xp: 5
        config:
          title: "Números y vida cotidiana"
          text: |
            Saber los números te permite comunicar precios, teléfonos, fechas y edades.

            A medida que avances, vas a combinar los números con otras señas para expresar ideas más completas.

  - code: leccion-1
    name: Los primeros números
    description: Aprende las señas de los números del uno al cinco.

    blocks:
      - type: INTRODUCE_SIGN
        config:
          meaning: uno
          word: uno

      - type: INTRODUCE_SIGN
        config:
          meaning: dos
          word: dos

      - type: INTRODUCE_SIGN
        config:
          meaning: tres
          word: tres

      - type: INTRODUCE_SIGN
        config:
          meaning: cuatro
          word: cuatro

      - type: INTRODUCE_SIGN
        config:
          meaning: cinco
          word: cinco

      - type: SELECT_MEANING
        xp: 5
        config:
          sign: uno
          options:
            - uno
            - dos
            - tres
            - cuatro

      - type: SELECT_SIGN
        xp: 5
        config:
          word: dos
          options:
            - uno
            - dos
            - tres
            - cinco

      - type: SELECT_MEANING
        xp: 5
        config:
          sign: tres
          options:
            - tres
            - cuatro
            - cinco
            - uno

      - type: CONTEXT_RESPONSE
        xp: 5
        config:
          question: "¿Qué número va después del cuatro?"
          answer: cinco
          options:
            - cinco
            - tres
            - dos
            - uno

      - type: MATCH
        xp: 10
        config:
          concepts:
            - uno
            - tres
            - cinco

      - type: VISUAL_RECOGNITION
        xp: 15
        config:
          sign_sequence:
            - uno
            - dos
            - tres
            - cuatro
          options:
            - uno
            - dos
            - tres
            - cuatro
            - cinco
          keep_order: false

