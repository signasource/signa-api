topic:
  code: unidad-2
  title: "Unidad 2"
  subtitle: "Las personas a nuestro alrededor"
  description: Aprendé a señar personas de tu entorno cercano.

lessons:
  - code: leccion-5
    name: "La familia"
    description: "Aprendé las señas de los miembros de la familia."

    blocks:
      - type: INTRODUCE_SIGN
        config:
          meaning: familia
          word: familia

      - type: INTRODUCE_SIGN
        config:
          meaning: mama
          word: mama

      - type: INTRODUCE_SIGN
        config:
          meaning: papa
          word: papa

      - type: INTRODUCE_SIGN
        config:
          meaning: hermano
          word: hermano

      - type: INTRODUCE_SIGN
        config:
          meaning: hijo
          word: hijo

      - type: INTRODUCE_SIGN
        config:
          meaning: abuelo
          word: abuelo

      - type: SELECT_MEANING
        xp: 5
        config:
          sign: mama
          options:
            - mama
            - papa
            - hermano
            - familia

      - type: SELECT_SIGN
        xp: 5
        config:
          word: papa
          options:
            - mama
            - papa
            - abuelo
            - familia

      - type: CONTEXT_RESPONSE
        xp: 5
        config:
          question: "¿Cómo llamás al padre de tu papá?"
          answer: abuelo
          options:
            - papa
            - hermano
            - hijo
            - abuelo

      - type: SELECT_MEANING
        xp: 5
        config:
          sign: hermano
          options:
            - hermano
            - hijo
            - abuelo
            - familia

      - type: CONTEXT_RESPONSE
        xp: 5
        config:
          question: "¿Cómo llamás al conjunto de tus parientes más cercanos?"
          answer: familia
          options:
            - familia
            - mama
            - papa
            - hermano

      - type: MATCH
        xp: 10
        config:
          concepts:
            - familia
            - mama
            - papa
            - hermano
            - hijo

      - type: VISUAL_RECOGNITION
        xp: 15
        config:
          sign_sequence:
            - mama
            - hijo
            - abuelo
            - papa
          options:
            - familia
            - mama
            - papa
            - hermano
            - hijo
            - abuelo
          keep_order: false

