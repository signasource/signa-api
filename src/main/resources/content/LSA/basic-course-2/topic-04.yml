topic:
  code: unidad-4
  title: "Unidad 4"
  subtitle: "Medios de transporte"
  description: Aprendé a señar los medios de transporte más comunes.

lessons:
  - code: leccion-1
    name: "Vehículos"
    description: "Aprendé las señas de auto, bicicleta y camión."

    blocks:
      - type: INTRODUCE_SIGN
        config:
          meaning: auto

      - type: INTRODUCE_SIGN
        config:
          meaning: bicicleta

      - type: INTRODUCE_SIGN
        config:
          meaning: "camión"

      - type: SELECT_MEANING
        xp: 5
        config:
          sign: auto
          options:
            - auto
            - bicicleta
            - "camión"

      - type: SELECT_SIGN
        xp: 5
        config:
          word: auto
          options:
            - auto
            - bicicleta
            - "camión"

      - type: CONTEXT_RESPONSE
        xp: 5
        config:
          question: "¿Qué vehículo grande se usa para transportar mercadería?"
          answer: "camión"
          options:
            - auto
            - bicicleta
            - "camión"

      - type: SELECT_MEANING
        xp: 5
        config:
          sign: bicicleta
          options:
            - auto
            - bicicleta
            - "camión"

      - type: MATCH
        xp: 10
        config:
          concepts:
            - auto
            - bicicleta
            - "camión"

  - code: leccion-2
    name: "Transporte público y más"
    description: "Aprendé las señas de colectivo, tren, subte, taxi y uber."

    blocks:
      - type: INTRODUCE_SIGN
        config:
          meaning: colectivo

      - type: INTRODUCE_SIGN
        config:
          meaning: tren

      - type: INTRODUCE_SIGN
        config:
          meaning: subte

      - type: INTRODUCE_SIGN
        config:
          meaning: taxi

      - type: INTRODUCE_SIGN
        config:
          meaning: uber

      - type: SELECT_MEANING
        xp: 5
        config:
          sign: colectivo
          options:
            - colectivo
            - tren
            - subte
            - taxi

      - type: SELECT_SIGN
        xp: 5
        config:
          word: tren
          options:
            - colectivo
            - tren
            - subte
            - uber

      - type: CONTEXT_RESPONSE
        xp: 5
        config:
          question: "¿Qué transporte viaja por debajo de la ciudad?"
          answer: subte
          options:
            - colectivo
            - tren
            - subte
            - taxi

      - type: SELECT_MEANING
        xp: 5
        config:
          sign: taxi
          options:
            - tren
            - subte
            - taxi
            - uber

      - type: MATCH
        xp: 10
        config:
          concepts:
            - colectivo
            - tren
            - subte
            - taxi
            - uber

