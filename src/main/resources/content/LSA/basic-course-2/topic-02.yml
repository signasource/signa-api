topic:
  code: unidad-2
  title: "Unidad 2"
  subtitle: "Lugares"
  description: Aprendé a señar los lugares más comunes de la ciudad.

lessons:
  - code: leccion-1
    name: "Educación y cultura"
    description: "Aprendé las señas de escuela, universidad, museo y jardín de infantes."

    blocks:
      - type: INTRODUCE_SIGN
        config:
          meaning: escuela

      - type: INTRODUCE_SIGN
        config:
          meaning: universidad

      - type: INTRODUCE_SIGN
        config:
          meaning: museo

      - type: INTRODUCE_SIGN
        config:
          meaning: "jardín de infantes"

      - type: SELECT_MEANING
        xp: 5
        config:
          sign: escuela
          options:
            - escuela
            - universidad
            - museo
            - "jardín de infantes"

      - type: SELECT_SIGN
        xp: 5
        config:
          word: universidad
          options:
            - escuela
            - universidad
            - museo
            - "jardín de infantes"

      - type: CONTEXT_RESPONSE
        xp: 5
        config:
          question: "¿A qué lugar van los niños muy pequeños a aprender?"
          answer: "jardín de infantes"
          options:
            - escuela
            - universidad
            - museo
            - "jardín de infantes"

      - type: SELECT_MEANING
        xp: 5
        config:
          sign: museo
          options:
            - escuela
            - universidad
            - museo
            - "jardín de infantes"

      - type: MATCH
        xp: 10
        config:
          concepts:
            - escuela
            - universidad
            - museo
            - "jardín de infantes"

  - code: leccion-2
    name: "En la ciudad"
    description: "Aprendé las señas de comercio, plaza, policía y hospital."

    blocks:
      - type: INTRODUCE_SIGN
        config:
          meaning: comercio

      - type: INTRODUCE_SIGN
        config:
          meaning: plaza

      - type: INTRODUCE_SIGN
        config:
          meaning: "policía"

      - type: INTRODUCE_SIGN
        config:
          meaning: hospital

      - type: SELECT_MEANING
        xp: 5
        config:
          sign: comercio
          options:
            - comercio
            - plaza
            - "policía"
            - hospital

      - type: SELECT_SIGN
        xp: 5
        config:
          word: plaza
          options:
            - comercio
            - plaza
            - "policía"
            - hospital

      - type: CONTEXT_RESPONSE
        xp: 5
        config:
          question: "¿A qué lugar vas cuando estás enfermo?"
          answer: hospital
          options:
            - comercio
            - plaza
            - "policía"
            - hospital

      - type: SELECT_MEANING
        xp: 5
        config:
          sign: "policía"
          options:
            - comercio
            - plaza
            - "policía"
            - hospital

      - type: MATCH
        xp: 10
        config:
          concepts:
            - comercio
            - plaza
            - "policía"
            - hospital

