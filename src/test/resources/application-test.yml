spring:
  application:
    name: signa-api-test

  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: test@example.com
    password: test-password
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

server:
  port: 8080

app:
    security:
        enabled: true

auth:
    google:
        client-id: "test-dummy-client-id"

jwt:
  secret: test-secret-key-with-sufficient-length-for-hmac-256-algorithm-12345
  access-token-expiration: 15000
  refresh-token-expiration: 604800000

firebase:
  enabled: false
  global-topic: test-global
