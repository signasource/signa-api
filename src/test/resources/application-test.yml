spring:
  application:
    name: signa-api-test
  
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

server:
  port: 8080

app:
  security:
    enabled: true

jwt:
  secret: test-secret-key-with-sufficient-length-for-hmac-256-algorithm-12345
  access-token-expiration: 15000
  refresh-token-expiration: 604800000
