spring:
  application:
    name: signa-api-test

  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: test@example.com
    password: test-password
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

server:
  port: 8080

auth:
  jwt:
    secret: test-secret-key-with-sufficient-length-for-hmac-256-algorithm-12345
  token-expirations:
    access: 15000
    refresh: 604800000
    password-reset: 3600000
    email-verification: 86400000

firebase:
  enabled: false
  global-topic: test-global
